services:
  - type: worker
    name: ticketai-flight-tracker
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FLIGHT_ORIGIN
        value: KNO
      - key: FLIGHT_DESTINATION
        value: CGK
      - key: FLIGHT_TARGET_DATES
        value: 2026-09-17,2026-09-18,2026-09-19
      - key: MIN_AFFORDABLE_PRICE
        value: "1300000"
      - key: MAX_AFFORDABLE_PRICE
        value: "1599000"
      - key: CHECK_INTERVAL_MINUTES
        value: "30"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
