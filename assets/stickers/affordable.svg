<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="50%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Badge Frame -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#FDE68A" stroke-width="8" filter="url(#shadow)"/>

  <!-- Target / Tag Icon -->
  <g transform="translate(156, 80) scale(1.6)">
    <circle cx="62" cy="62" r="45" fill="#F59E0B" opacity="0.3"/>
    <circle cx="62" cy="62" r="32" fill="#F59E0B"/>
    <circle cx="62" cy="62" r="16" fill="#78350F"/>
    <circle cx="62" cy="62" r="6" fill="#FDE68A"/>
  </g>

  <!-- Deal Title -->
  <rect x="56" y="270" width="400" height="70" rx="35" fill="url(#badgeGrad)" filter="url(#shadow)"/>
  <text x="256" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="26" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    🟡 TARGET AFFORDABLE
  </text>

  <!-- Subtitle Text -->
  <text x="256" y="385" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#FEF3C7" text-anchor="middle">
    MASUK BUDGET TARGET
  </text>
  <text x="256" y="425" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" fill="#FDE68A" text-anchor="middle">
    Rp 1.451.000 - Rp 1.599.000
  </text>
</svg>
