<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450A0A"/>
      <stop offset="50%" stop-color="#7F1D1D"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Badge Frame -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#FCA5A5" stroke-width="8" filter="url(#shadow)"/>

  <!-- Flame / Alert Icon -->
  <g transform="translate(196, 80) scale(1.2)">
    <path d="M60,10 C60,10 80,40 80,60 C80,75 70,90 55,95 C70,90 75,75 70,65 C65,85 45,95 35,95 C20,95 10,80 10,65 C10,40 40,20 60,10 Z" fill="#FBBF24"/>
    <path d="M50,40 C50,40 65,60 65,72 C65,82 57,90 47,93 C57,88 60,78 55,70 C52,82 38,90 30,88 C20,85 18,75 22,68 C28,55 50,40 50,40 Z" fill="#EF4444"/>
  </g>

  <!-- Deal Title -->
  <rect x="56" y="270" width="400" height="70" rx="35" fill="url(#badgeGrad)" filter="url(#shadow)"/>
  <text x="256" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    🚨 SUPER CHEAP!
  </text>

  <!-- Subtitle Text -->
  <text x="256" y="385" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#FECACA" text-anchor="middle">
    HARGA DROP BANGET
  </text>
  <text x="256" y="425" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" fill="#FCA5A5" text-anchor="middle">
    &lt; Rp 1.300.000
  </text>
</svg>
