<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Sticker Circle / Badge Base -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="8" filter="url(#shadow)"/>

  <!-- Decorative Inner Ring -->
  <rect x="36" y="36" width="440" height="440" rx="76" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- Airplane Icon Vector -->
  <g transform="translate(136, 90) scale(1.5)" filter="url(#glow)">
    <path d="M120,15 L100,55 L30,85 L30,105 L100,85 L100,135 L80,155 L80,170 L110,160 L140,170 L140,155 L120,135 L120,85 L190,105 L190,85 L120,55 Z" 
          fill="url(#accentGrad)" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Main Title Banner -->
  <rect x="76" y="320" width="360" height="64" rx="32" fill="url(#badgeGrad)" filter="url(#shadow)"/>
  <text x="256" y="362" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="26" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    ✈️ FLIGHT ALERT
  </text>

  <!-- Subtitle Label -->
  <text x="256" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#94A3B8" text-anchor="middle" letter-spacing="1">
    KNO ➔ CGK TRACKER
  </text>
  
  <!-- Corner Shiny Sparkles -->
  <circle cx="90" cy="90" r="6" fill="#38BDF8" opacity="0.8"/>
  <circle cx="422" cy="90" r="10" fill="#818CF8" opacity="0.8"/>
  <circle cx="422" cy="422" r="6" fill="#38BDF8" opacity="0.8"/>
  <circle cx="90" cy="422" r="8" fill="#818CF8" opacity="0.8"/>
</svg>
