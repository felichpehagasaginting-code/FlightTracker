<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Badge Frame -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#6EE7B7" stroke-width="8" filter="url(#shadow)"/>

  <!-- Checkmark Icon -->
  <g transform="translate(156, 80) scale(1.6)">
    <circle cx="62" cy="62" r="50" fill="#10B981" opacity="0.3"/>
    <circle cx="62" cy="62" r="40" fill="#10B981"/>
    <path d="M45,62 L57,74 L80,50" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Deal Title -->
  <rect x="56" y="270" width="400" height="70" rx="35" fill="url(#badgeGrad)" filter="url(#shadow)"/>
  <text x="256" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="26" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    🟢 DEAL BAGUS BANGET
  </text>

  <!-- Subtitle Text -->
  <text x="256" y="385" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#D1FAE5" text-anchor="middle">
    HARGA MANTAP &amp; AFFORDABLE
  </text>
  <text x="256" y="425" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" fill="#A7F3D0" text-anchor="middle">
    Rp 1.300.000 - Rp 1.450.000
  </text>
</svg>
